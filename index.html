<style>
  :root{
    --night-1:#1d1233; --night-2:#2a1747; --night-3:#3a2160;
    --cream:#F7F1E4; --cream-2:#ECE3D0; --ink:#241a2e; --ink-soft:#6b5e74;
    --coral:#FF6B5C; --yellow:#FFC23C; --grape:#7C5BC9; --teal:#2BB3A3; --gold:#E0A52B;
    --line:#d8cdb6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--cream);
    background:
      radial-gradient(1200px 600px at 50% -10%, #45286f 0%, rgba(69,40,111,0) 60%),
      linear-gradient(180deg,var(--night-1) 0%, var(--night-2) 55%, var(--night-1) 100%);
    background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px;}
  .bulbs{display:flex;gap:10px;justify-content:center;padding:6px 0 14px;}
  .bulb{width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFF1C2, var(--yellow) 55%, #b9842a 100%);
    box-shadow:0 0 10px 1px rgba(255,194,60,.55);}

  @media (prefers-reduced-motion:no-preference){
    .bulb:nth-child(2n){animation:flick 2.6s ease-in-out infinite}
    .bulb:nth-child(3n){animation:flick 3.4s ease-in-out infinite .4s}
  }
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:clamp(30px,8vw,46px);line-height:.98;letter-spacing:-.5px;text-align:center;margin:0;text-wrap:balance;}
  h1 .pop{color:var(--yellow);}
  .sub{font-family:'Space Mono',monospace;text-align:center;color:#cbb9ec;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;margin:12px 0 0;}
  .how{text-align:center;color:#bcacd8;font-size:13.5px;margin:14px auto 0;max-width:460px;line-height:1.5;}

  .who{margin:24px 0 6px;}
  .who-lbl{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9c8dc0;text-align:center;margin-bottom:11px;}
  .people{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .person{border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--cream);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
  .person:hover{border-color:rgba(255,255,255,.4);}
  .person .ini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1a1226;}
  .person.active{background:var(--cream);color:var(--ink);border-color:var(--cream);}
  .status{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .refresh{background:none;border:none;color:#a99ac9;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;letter-spacing:.5px;text-decoration:underline;text-underline-offset:3px;}
  .modepill{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.5px;padding:3px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.2);color:#bcacd8;}
  .banner{font-family:'Space Mono',monospace;font-size:11.5px;color:#241a2e;background:var(--yellow);border-radius:8px;padding:9px 12px;margin:14px 0 0;text-align:center;line-height:1.5;}

  .sec{display:flex;align-items:center;gap:12px;margin:34px 2px 16px;}
  .sec h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;margin:0;color:#e9def6;white-space:nowrap;}
  .sec .ln{height:1px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0));}
  .sec .tag{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:1px;color:#1a1226;background:var(--yellow);padding:3px 8px;border-radius:5px;text-transform:uppercase;}

  .ticket{background:var(--cream);color:var(--ink);border-radius:16px;margin:0 0 16px;position:relative;box-shadow:0 14px 30px -16px rgba(0,0,0,.6);overflow:hidden;}
  .ticket.locked{opacity:.62;}
  .stub-top{display:flex;align-items:baseline;gap:10px;padding:15px 18px 13px;flex-wrap:wrap;}
  .date{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:1px;color:#fff;background:var(--ink);padding:5px 9px;border-radius:6px;text-transform:uppercase;}
  .dtitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;line-height:1.1;}
  .grp{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-left:auto;border:1px solid var(--line);padding:3px 7px;border-radius:5px;}
  .perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px;}
  .perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--night-2);}
  .perf::before{left:-24px;} .perf::after{right:-24px;}
  .intro{font-size:13px;color:var(--ink-soft);padding:12px 18px 0;line-height:1.5;}

  .slot{padding:14px 18px 4px;}
  .slot-lbl{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:9px;}
  .opt{border:1.5px solid var(--cream-2);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.14s;background:#fffdf8;}
  .opt:hover{border-color:#cbb89a;}
  .opt.mine{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral);background:#fff7f5;}
  .opt.disabled{cursor:default;}
  .opt-head{display:flex;align-items:flex-start;gap:9px;}
  .check{width:20px;height:20px;border-radius:50%;border:2px solid #d3c4a6;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff;}
  .check.sq{border-radius:6px;}
  .opt.mine .check{background:var(--coral);border-color:var(--coral);}
  .opt-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;line-height:1.2;}
  .opt-desc{font-size:13px;color:var(--ink-soft);line-height:1.45;margin:3px 0 0;}
  .opt-meta{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .cost{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--ink);background:var(--cream-2);padding:3px 8px;border-radius:5px;}
  .lk{font-size:12px;text-decoration:none;font-weight:600;display:inline-flex;gap:4px;align-items:center;}
  .lk.t{color:#c2185b;} .lk.g{color:var(--grape);} .lk.j{color:#1a1226;}
  .lk:hover{text-decoration:underline;}
  .badge{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:5px;text-transform:uppercase;}
  .badge.down{background:#dff3ee;color:#11796a;} .badge.rec{background:#e9e2fb;color:#5b3ea8;}
  .lead{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;color:#1a1226;background:var(--yellow);padding:3px 7px;border-radius:5px;letter-spacing:.5px;}
  .voters{display:flex;align-items:center;gap:5px;margin-left:auto;}
  .vini{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#1a1226;border:1.5px solid #fff;}
  .vcount{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .note{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:2px 18px 16px;}
  .locktag{font-family:'Space Mono',monospace;font-size:11px;color:#1c7a45;background:#d9f0e0;display:block;width:fit-content;max-width:calc(100% - 36px);padding:5px 10px;border-radius:6px;margin:0 18px 8px;line-height:1.4;}
  .planrow{margin:0 18px 7px;}
  .planname{font-weight:700;font-size:14px;color:var(--ink);}
  .planvotes{font-family:'Space Mono',monospace;font-size:10.5px;color:#1c7a45;background:#d9f0e0;padding:2px 7px;border-radius:5px;margin-left:6px;}
  .planfit{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .planhead{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--coral);margin:9px 18px 4px;}
  .planbundle{font-size:12px;color:var(--coral);margin:2px 18px 9px;font-style:italic;}
  .pin{display:inline-block;background:var(--coral);color:#fff;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.5px;padding:3px 8px;border-radius:5px;margin:0 18px 14px;text-transform:uppercase;font-weight:700;}

  .foot{text-align:center;color:#8d7eae;font-size:12px;margin-top:30px;line-height:1.6;font-family:'Space Mono',monospace;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;border:1px solid rgba(255,255,255,.15);z-index:9;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .pickfirst{text-align:center;color:#cbb9ec;font-size:13px;font-family:'Space Mono',monospace;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:10px;padding:11px;margin:18px 0 4px;}
  .badge.booked{background:#d9f0e0;color:#1c7a45;}
  .hbody{padding:13px 18px 16px;}
  .hroom{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px;margin-bottom:5px;color:var(--ink);}
  .ticket.travelcard{background:linear-gradient(180deg,#fff5e9,#F7F1E4);}
  .timeline{margin:10px 20px 14px;padding-left:18px;}
  .timeline li{font-size:13px;color:var(--ink);line-height:1.65;margin-bottom:3px;}
  .timeline li::marker{color:var(--coral);}
  .panel{margin:0 0 14px;}
  .panel-head{width:100%;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--cream);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;padding:15px 16px;cursor:pointer;text-align:left;border-radius:13px;transition:.15s;}
  .panel-head:hover{background:rgba(255,255,255,.12);}
  .panel.open .panel-head{border-radius:13px 13px 0 0;border-bottom-color:transparent;}
  .chev{font-size:11px;color:var(--yellow);width:13px;flex:none;}
  .panel-title{flex:1;}
  .panel-count{font-family:'Space Mono',monospace;font-size:11px;color:#cbb9ec;}
  .panel-tag{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:1px;color:#1a1226;background:var(--yellow);padding:3px 8px;border-radius:5px;text-transform:uppercase;}
  .panel-body{padding:10px 0 2px;}
</style>

let me_voter = null;
let votes = {}; // { voter: { slotId: optId | [optId,...] } }

const $ = s => document.querySelector(s);
const toast = (m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

// ---------- storage abstraction (Firebase → Claude → device) ----------
const Store = {
  mode:'local',
  async init(onChange){
    this.onChange = onChange;
    if(FIREBASE_CONFIG){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.database();
        this.mode = 'firebase';
        this.db.ref('trip/votes').on('value', s => onChange(s.val() || {}));
        return;
      }catch(e){ console.warn('Firebase init failed, falling back.', e); }
    }
    if(window.storage){ this.mode='claude'; onChange(await this.readClaude()); return; }
    this.mode='local'; onChange(this.readLocal());
  },
  async readClaude(){ const out={}; for(const v of VOTERS){ try{ const r=await window.storage.get('votes:'+v.name,true); out[v.name]=(r&&r.value)?JSON.parse(r.value):{}; }catch(_){ out[v.name]={}; } } return out; },
  readLocal(){ try{ return JSON.parse(localStorage.getItem('trip:votes')||'{}'); }catch(_){ return {}; } },
  async setVoter(name,obj){
    if(this.mode==='firebase'){ try{ await this.db.ref('trip/votes/'+name).set(obj); }catch(e){ toast('Save failed'); } }
    else if(this.mode==='claude'){ try{ await window.storage.set('votes:'+name, JSON.stringify(obj), true); }catch(e){ toast('Save failed'); } }
    else { try{ const all=this.readLocal(); all[name]=obj; localStorage.setItem('trip:votes', JSON.stringify(all)); }catch(e){ toast('Save failed'); } }
  },
  async refresh(){
    if(this.mode==='claude') this.onChange(await this.readClaude());
    else if(this.mode==='local') this.onChange(this.readLocal());
  }
};

$('#bulbs').innerHTML = Array.from({length:13}).map(()=>'<span class="bulb"></span>').join('');
$('#people').innerHTML = VOTERS.map(v=>`<button class="person" data-n="${v.name}"><span class="ini" style="background:${v.color}">${ini(v.name)}</span>${v.name}</button>`).join('');
$('#people').addEventListener('click', e=>{ const b=e.target.closest('.person'); if(!b) return; me_voter=b.dataset.n; try{localStorage.setItem('trip:me',me_voter);}catch(_){ } render(); });

function valFor(voter, slotId){ return (votes[voter]||{})[slotId]; }
function tallyFor(slotId, optId){
  return VOTERS.filter(v=>{ const x=valFor(v.name,slotId); return Array.isArray(x)?x.includes(optId):x===optId; }).map(v=>v.name);
}
function leaderFor(slot){
  const counts = slot.opts.map(o=>({id:o.id,n:tallyFor(slot.id,o.id).length}));
  const max=Math.max(...counts.map(c=>c.n));
  if(max===0) return null;
  const top=counts.filter(c=>c.n===max);
  return top.length===1?top[0].id:null;
}
function castVote(slotId, optId, multi){
  if(!me_voter){ toast('Pick your name first'); return; }
  votes[me_voter]=votes[me_voter]||{};
  if(multi){
    let arr = Array.isArray(votes[me_voter][slotId])?votes[me_voter][slotId].slice():[];
    arr = arr.includes(optId) ? arr.filter(x=>x!==optId) : arr.concat(optId);
    if(arr.length) votes[me_voter][slotId]=arr; else delete votes[me_voter][slotId];
  } else {
    if(votes[me_voter][slotId]===optId) delete votes[me_voter][slotId];
    else votes[me_voter][slotId]=optId;
  }
  Store.setVoter(me_voter, votes[me_voter]);
  render();
}
window.castVote = castVote;

let openSections = { plan:true, hotels:false, flights:false, eatmtl:true, foods:false, dontmiss:false, fun:false, eatqc:false };
function toggleSection(k){ openSections[k]=!openSections[k]; render(); }
window.toggleSection = toggleSection;
function panel(key, title, tagText, bodyHTML){
  const open = !!openSections[key];
  return `<div class="panel${open?' open':''}">
    <button class="panel-head" onclick="toggleSection('${key}')">
      <span class="chev">${open?'▾':'▸'}</span>
      <span class="panel-title">${title}</span>
      <span class="panel-tag">${tagText}</span>
    </button>${open?`<div class="panel-body">${bodyHTML}</div>`:''}</div>`;
}

function optHTML(slot, o){
  const who = tallyFor(slot.id,o.id);
  const x = valFor(me_voter, slot.id);
  const mine = me_voter && (Array.isArray(x)?x.includes(o.id):x===o.id);
  const clickable = !!me_voter;
  const leader = leaderFor(slot)===o.id;
  const badge = o.tag==='down' ? '<span class="badge down">Downtime</span>' : (o.tag==='rec' ? '<span class="badge rec">Recreation</span>' : '');
  return `<div class="opt${mine?' mine':''}${clickable?'':' disabled'}" ${clickable?`onclick="castVote('${slot.id}','${o.id}',${slot.multi?'true':'false'})"`:''}>
    <div class="opt-head">
      <div class="check${slot.multi?' sq':''}">${mine?'✓':''}</div>
      <div style="flex:1">
        <div class="opt-name">${o.name}</div>
        <div class="opt-desc">${o.desc}</div>
        <div class="opt-meta">
          <span class="cost">${o.cost}</span>
          ${badge}
          ${o.site
              ? `<a class="lk j" href="${o.site}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${o.jfl?'Tickets':'Website'}</a>`
              : (o.jfl
                  ? `<a class="lk j" href="${JFL}" target="_blank" rel="noopener" onclick="event.stopPropagation()">◆ Tickets</a>`
                  : '')}
          ${!o.jfl
              ? `<a class="lk g" href="${g(o.q)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔎 Look it up</a>`
              : ''}
          ${o.vid
              ? `<a class="lk t" href="${o.vid}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${o.vid.includes('tiktok.com')?'📱 TikTok':'▶ Video'}</a>`
              : `<a class="lk t" href="${tk(o.q)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📱 TikTok</a>`}
          ${leader?'<span class="lead">★ Leading</span>':''}
          <span class="voters">${who.map(n=>`<span class="vini" style="background:${colorOf(n)}" title="${n}">${ini(n)}</span>`).join('')}${who.length?`<span class="vcount">${who.length}</span>`:''}</span>
        </div>
      </div>
    </div>
  </div>`;
}

const PLAN = {

const MEAL_WHEN = { brunch:'a slow morning (brunch)', lunch:'a lunch stop', dinner:'an open dinner night', lunchdinner:'lunch or dinner', casual:'a casual / late-night bite', togo:'grab for the drive to QC' };
const REST_INFO = {
  timeout:{zone:'Downtown',meal:'lunchdinner'}, jatoba:{zone:'Downtown',meal:'dinner'}, celeste:{zone:'Downtown',meal:'dinner'},
  apdc:{zone:'Plateau',meal:'dinner'}, lexpress:{zone:'Plateau',meal:'dinner'}, violon:{zone:'Plateau',meal:'dinner'},

};

function planRow(name,votes,when,why){
  return `<div class="planrow"><span class="planname">★ ${name}</span><span class="planvotes">✓ ${votes}</span>`
       + (when?`<div class="planfit">→ ${when}${why?` · ${why}`:''}</div>`:(why?`<div class="planfit">${why}</div>`:''))
       + `</div>`;
}
function planHTML(){
  const fav=(arr,slot)=>arr.filter(o=>tallyFor(slot,o.id).length>=PLAN_TH);
  const funF=fav(FUN,'fun'), dmF=fav(DONTMISS,'dontmiss'), foodF=fav(FOODS,'food'), mtlR=fav(RESTAURANTS,'eat'), qcR=fav(QC_RESTAURANTS,'eatqc');
  const total=funF.length+dmF.length+foodF.length+mtlR.length+qcR.length;
  let h=`<div class="ticket"><div class="intro" style="padding-top:14px">As soon as <b>2 or more of you</b> tap the same thing, it lands here with a suggested day — matched to where you already are and kept clear of your booked show nights. Keep voting and the plan fills itself in.</div>`;
  if(!total){ h+=`<div class="note" style="font-style:normal;color:var(--ink-soft)">Nothing has 2+ votes yet — tap your picks in the sections below ↓</div></div>`; return h; }

  // Activities + sights, grouped by city, with same-zone bundling
  const acts=[].concat(funF.map(o=>['fun',o]), dmF.map(o=>['dontmiss',o]))
    .map(([slot,o])=>({o,n:tallyFor(slot,o.id).length,p:PLAN[o.id]})).filter(x=>x.p);
  if(acts.length){
    h+=`<div class="slot-lbl" style="margin-top:10px">What to do — suggested days</div>`;
    ['Montréal','Québec City'].forEach(city=>{
      const inCity=acts.filter(x=>x.p.city===city);
      if(!inCity.length) return;
      h+=`<div class="planhead">${city}</div>`;
      inCity.forEach(x=> h+=planRow(x.o.name,x.n,x.p.when,x.p.why));
      const zones={}; inCity.forEach(x=>{(zones[x.p.zone]=zones[x.p.zone]||[]).push(x.o.name);});
      Object.keys(zones).forEach(z=>{ if(zones[z].length>1) h+=`<div class="planbundle">↪ All in ${z} — do them the same day: ${zones[z].join(', ')}</div>`; });
    });
  }

  // Restaurants → slotted to the right meal
  if(mtlR.length||qcR.length){
    h+=`<div class="slot-lbl" style="margin-top:12px">Crowd-favorite tables — slotted to the right meal</div>`;
    const restRow=(o,slot)=>{ const i=REST_INFO[o.id]||{}; return planRow(o.name, tallyFor(slot,o.id).length, MEAL_WHEN[i.meal]||'a meal out', i.zone||''); };
    if(mtlR.length){ h+=`<div class="planhead">Montréal</div>`; mtlR.forEach(o=> h+=restRow(o,'eat')); }
    if(qcR.length){ h+=`<div class="planhead">Québec City</div>`; qcR.forEach(o=> h+=restRow(o,'eatqc')); }
  }

  // Foods → just make sure we eat them
  if(foodF.length){
    h+=`<div class="slot-lbl" style="margin-top:12px">Don\u2019t-miss bites</div>`;
    foodF.forEach(o=> h+=planRow(o.name,tallyFor('food',o.id).length,'',''));
  }
  h+=`</div>`;
  return h;
}


function render(){
  const y=window.scrollY;
  document.querySelectorAll('.person').forEach(p=>p.classList.toggle('active', p.dataset.n===me_voter));
  $('#modepill').textContent = Store.mode==='firebase' ? '◆ shared live' : (Store.mode==='claude' ? '◆ shared in Claude' : '◆ this device only');
  $('#banner').innerHTML = (Store.mode==='local')
    ? '<div class="banner">Saving on this device only. Add a free Firebase config (see the note at the top of the file) to share votes across the family.</div>' : '';

  let html='';
  if(!me_voter) html += `<div class="pickfirst">↑ Pick your name to start voting (you can still browse below)</div>`;

  // --- Family plan (live, auto-fills from votes) ---
  html += panel('plan','🧭 Family plan (live)','Auto', planHTML());

  // --- Hotels (collapsible) ---
  let hotelsHTML='';
  HOTELS.forEach(h=>{
    hotelsHTML += `<div class="ticket"><div class="stub-top"><span class="date">${h.dates}</span><span class="dtitle">${h.name}</span><span class="badge booked" style="margin-left:auto">Booked</span></div><div class="perf"></div>
      <div class="hbody"><div class="hroom">${h.room}</div><div class="opt-desc">${h.note}</div>
      <div class="opt-meta"><a class="lk g" href="${g(h.q)}" target="_blank" rel="noopener">🔎 Look it up</a></div></div></div>`;
  });
  html += panel('hotels','Where we\u2019re staying','Booked', hotelsHTML);

  // --- Flights (collapsible) ---
  let flightsHTML='';
  FLIGHTS.forEach(f=>{
    flightsHTML += `<div class="ticket"><div class="stub-top"><span class="date">${f.date}</span><span class="dtitle">${f.dir}</span><span class="badge booked" style="margin-left:auto">✈ Booked</span></div><div class="perf"></div>
      <div class="hbody">${f.legs.map(l=>`<div class="hroom" style="font-size:13px">${l}</div>`).join('')}<div class="opt-desc">${f.note}</div></div></div>`;
  });
  html += panel('flights','Flights','Booked', flightsHTML);

  // --- Where to eat — Montréal (collapsible) ---
  const eatSlot = {id:'eat', multi:true, opts:RESTAURANTS};
  let mtlEat = `<div class="ticket"><div class="intro" style="padding-top:14px">Tap every spot you\u2019d be happy with — the winners get aimed at the open dinner nights. 📱 TikTok and 🔎 links on each.</div><div class="slot"><div class="slot-lbl">Tap as many as you like</div>`;
  RESTAURANTS.forEach(o=> mtlEat += optHTML(eatSlot,o));
  mtlEat += `</div></div>`;
  html += panel('eatmtl','Where to eat — Montréal','Pick all', mtlEat);

  // --- Must-try regional foods (collapsible, votable) ---
  const foodSlot = {id:'food', multi:true, opts:FOODS};
  let foodHTML = `<div class="ticket"><div class="intro" style="padding-top:14px">The dishes you shouldn\u2019t leave Québec without. Tap the ones you don\u2019t want to miss — we\u2019ll make sure they land somewhere on the trip.</div><div class="slot"><div class="slot-lbl">Tap as many as you like</div>`;
  FOODS.forEach(o=> foodHTML += optHTML(foodSlot,o));
  foodHTML += `</div></div>`;
  html += panel('foods','Must-try foods of the region','Pick all', foodHTML);

  // --- Fun & out-of-the-ordinary (collapsible) ---
  const funSlot = {id:'fun', multi:true, opts:FUN};
  let funHTML = `<div class="ticket"><div class="intro" style="padding-top:14px">Out-of-the-ordinary picks to work into any day — tap whatever sounds fun. (MTL = Montréal, QC = Québec City.)</div><div class="slot"><div class="slot-lbl">Tap as many as you like</div>`;
  FUN.forEach(o=> funHTML += optHTML(funSlot,o));
  funHTML += `</div></div>`;
  html += panel('fun','Fun & out-of-the-ordinary','Pick all', funHTML);

  // --- Don't miss: sights, history & ghost stories (collapsible, votable) ---
  const dmSlot = {id:'dontmiss', multi:true, opts:DONTMISS};
  let dmHTML = `<div class="ticket"><div class="intro" style="padding-top:14px">Not just shows — the landmarks, history and a couple of genuinely spooky local legends. Tap whatever you want to make sure we do. (MTL = Montréal, QC = Québec City. 👻 = ghost walk.)</div><div class="slot"><div class="slot-lbl">Tap as many as you like</div>`;
  DONTMISS.forEach(o=> dmHTML += optHTML(dmSlot,o));
  dmHTML += `</div></div>`;
  html += panel('dontmiss','Don\u2019t miss — sights, history & ghost stories','Pick all', dmHTML);

  // --- Days ---
  let openedAll=false;
  DAYS.forEach(day=>{
    if(day.headerBefore){ html += `<div class="sec"><h2>${day.headerBefore}</h2><div class="ln"></div><span class="tag">Jul 27+</span></div>`; openedAll=true; }
    else if(day.group==='all' && !openedAll){ html += `<div class="sec"><h2>Everyone together</h2><div class="ln"></div><span class="tag">From Jul 23</span></div>`; openedAll=true; }
    else if(day.id==='d1'){ html += `<div class="sec"><h2>The three of us</h2><div class="ln"></div><span class="tag">Jul 17–22</span></div>`; }
    if(day.eat){
      const eatSlot={id:day.id, multi:true, opts:day.restaurants};
      let qcEat = `<div class="ticket"><div class="intro" style="padding-top:14px">${day.intro}</div><div class="slot"><div class="slot-lbl">Tap as many as you like</div>`;
      day.restaurants.forEach(o=> qcEat += optHTML(eatSlot,o));
      qcEat += `</div></div>`;
      html += panel('eatqc', day.title, 'Pick all', qcEat);
      return;
    }
    const savLocked = (me_voter==='Savannah' && day.group==='trio');
    html += `<div class="ticket${savLocked?' locked':''}${day.travel?' travelcard':''}">`;
    html += `<div class="stub-top"><span class="date">${day.date}</span><span class="dtitle">${day.title}</span><span class="grp">${day.travel?'🚗 Drive':(day.group==='trio'?'V · E · Sierra':'All four')}</span></div><div class="perf"></div>`;
    if(day.pin) html += `<div class="pin">${day.pin}</div>`;
    if(day.locked){ (Array.isArray(day.locked)?day.locked:[day.locked]).forEach(function(L){ html += `<div class="locktag">${L}</div>`; }); }
    if(day.travel && day.timeline){ html += `<div class="intro">Travel day — the shape of it:</div><ul class="timeline">${day.timeline.map(t=>`<li>${t}</li>`).join('')}</ul>`; }
    if(savLocked){ html += `<div class="note">Before you land — Vanessa, Erik & Sierra are choosing this one.</div>`; }
    else if(day.slots){ day.slots.forEach(slot=>{ slot.multi = !slot.single; html += `<div class="slot"><div class="slot-lbl">${slot.label}</div>`; slot.opts.forEach(o=> html += optHTML(slot,o)); html += `</div>`; }); }
    if(day.note) html += `<div class="note">${day.note}</div>`;
    html += `</div>`;
  });

  $('#board').innerHTML = html;
  window.scrollTo(0,y);
}

  try{ const m=localStorage.getItem('trip:me'); if(m) me_voter=m; }catch(_){}
  await Store.init(data=>{ votes = data||{}; render(); });
  render();
})();
